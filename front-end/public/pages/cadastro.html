<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ToShare</title>
    <link rel="stylesheet" href="../css/style-cadastro.css">
</head>
<body>
    <form action="cadastrar-usuario" class="cad-container" onsubmit="cadastrarUsuario(event)">
        <div class="cad-title">
            <h1>Criar conta</h1>
        </div>
        <div class="campo">
            <label for="">Nome de usuário</label>
            <input type="text" id="ipt_username" placeholder="Ex: nome_usuario" oninput="validarUsername()">
            <p class="msg-validando" id="msg_username"></p>
        </div>
        <div class="campo">
            <label for="">Email</label>
            <input type="text" id="ipt_email" placeholder="Ex: usuario@mail.com" oninput="validarEmail()">
            <p class="msg-validando" id="email_arroba"></p>
            <p class="msg-validando" id="email_antes"></p>
        </div>
        <div class="campo">
            <label for="">Senha</label>
            <input type="text" id="ipt_senha" placeholder="Mínimo de 6 caracteres">
            <p class="msg-validando" id="msg_senha"></p>
        </div>
        <div class="campo">
            <label for="">Confirmar senha</label>
            <input type="text" id="ipt_conf_senha" placeholder="Repita a senha">
            <p class="msg-validando" id="msg_conf_senha"></p>
        </div>
        <div>
            <button  type="onsubmit" class="cad-button">
                Cadastrar
            </button>
        </div>
    </form>
</body>
</html>
<script src="../js/cadastro.js"></script>
