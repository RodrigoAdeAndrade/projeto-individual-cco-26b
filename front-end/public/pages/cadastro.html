<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ToShare</title>
    <link rel="stylesheet" href="../css/style-cadastro.css">
</head>
<body>
    <form action="/cadastrar-usuario" class="cad-container" onsubmit="cadastrarUsuario(event)">
        <div class="cad-title">
            <h1>Faça parte da comunidade</h1>
        </div>
        <div class="campo">
            <label for="ipt_username">Nome de usuário</label>
            <input type="text" id="ipt_username" placeholder="Ex: nome_usuario" oninput="validarUsername()">
            <p class="msg-validando" id="msg_username"></p>
        </div>
        <div class="campo">
            <label for="ipt_email">Email</label>
            <input type="text" id="ipt_email" placeholder="Ex: usuario@mail.com" oninput="validarEmail()">
            <p class="msg-validando" id="msg_email"></p>
        </div>
        <div class="campo">
            <label for="ipt_senha">Senha</label>
            <input type="password" id="ipt_senha" placeholder="Mínimo de 6 caracteres" oninput="validarSenha()">
            <p class="msg-validando" id="msg_senha"></p>
            <p class="msg-validando" id="msg_caractere"></p>
        </div>
        <div class="campo">
            <label for="ipt_conf_senha">Confirmar senha</label>
            <input type="password" id="ipt_conf_senha" placeholder="Repita a senha" oninput="confirmarSenha()">
            <p class="msg-validando" id="msg_conf_senha"></p>
        </div>
        <div>
            <button  type="submit" class="cad-button">
                Cadastrar
            </button>
        </div>
    </form>
    <div class="cad-login">
        <p>Já possui uma conta?<a href="login.html"> Entrar</a></p>
    </div>
</body>
<script src="../js/cadastro.js"></script>
</html>
