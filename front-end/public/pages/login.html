<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ToShare</title>
    <link rel="stylesheet" href="../css/style-login.css">
</head>

<body>
    <form action="acessar-conta" class="login-container">
        <div class="login-title">
            <h1>Acesse sua conta</h1>
        </div>
        <div class="campo">
            <label for="ipt_username">Email</label>
            <input type="text" id="ipt_email" placeholder="Digite seu email">
            <p id="msg_email"></p>
        </div>
        <div class="campo">
            <label for="ipt_senha">Senha</label>
            <input type="text" id="ipt_senha" placeholder="Digite sua senha">
            <p id="msg_senha"></p>
        </div>
        <div>
            <button onsubmit="acessar-conta" class="login-button">
                Acessar conta
            </button>
        </div>
    </form>
    <div class="cad-login">
        <p>Ainda não é usuário? <a href="cadastro.html">Cadastre-se</a></p>
    </div>
</body>

</html>
<script src=""></script>
